name: device_calendar
description: A cross platform plugin for modifying calendars on the user's device.
version: 4.3.3
homepage: https://github.com/builttoroam/device_calendar/tree/master

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.16.0
  sprintf: ^7.0.0
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        package: com.builttoroam.devicecalendar
        pluginClass: DeviceCalendarPlugin
      ios:
        pluginClass: SwiftDeviceCalendarPlugin